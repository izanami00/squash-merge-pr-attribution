name: Build and publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. It must match package.json, for example v0.2.5.
        required: true
        type: string
      prerelease:
        description: Mark this GitHub Release as a pre-release.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build VSIX and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package_version="$(node --print \"require('./package.json').version\")"
          expected_tag="v$package_version"
          test "$RELEASE_TAG" = "$expected_tag" || {
            echo "Release tag must be $expected_tag; received $RELEASE_TAG."
            exit 1
          }

      - name: Build VSIX
        run: npm run package

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $RELEASE_TAG."
            exit 1
          fi

          release_args=("$RELEASE_TAG" "dist"/*.vsix --target "$GITHUB_SHA" --title "Squash Merge PR Attribution ${RELEASE_TAG#v}" --generate-notes)
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
