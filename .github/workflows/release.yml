name: Build and publish GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build VSIX and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read release metadata from package.json
        id: release
        shell: bash
        run: |
          package_version="$(node --print \"require('./package.json').version\")"
          release_tag="v$package_version"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

          if [[ "$package_version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Preparing GitHub Release $release_tag."

      - name: Build VSIX
        run: npm run package

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $RELEASE_TAG."
            exit 1
          fi

          release_args=("$RELEASE_TAG" "dist"/*.vsix --target "$GITHUB_SHA" --title "Squash Merge PR Attribution $RELEASE_VERSION" --generate-notes)
          if [ "$IS_PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
